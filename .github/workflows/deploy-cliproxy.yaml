name: Deploy CLIProxy

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      CLIPROXY_SSH_KEY:
        required: true
      CLIPROXY_MANAGEMENT_KEY:
        required: true
      CLIPROXY_DOMAIN:
        required: true

concurrency:
  group: deploy-cliproxy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-cliproxy:
    runs-on: ubuntu-latest
    environment: cliproxy
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate required secrets
        env:
          CLIPROXY_SSH_KEY: ${{ secrets.CLIPROXY_SSH_KEY }}
          CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}
          CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}
        run: |
          missing=()
          [[ -n "${CLIPROXY_SSH_KEY}" ]] || missing+=("CLIPROXY_SSH_KEY")
          [[ -n "${CLIPROXY_MANAGEMENT_KEY}" ]] || missing+=("CLIPROXY_MANAGEMENT_KEY")
          [[ -n "${CLIPROXY_DOMAIN}" ]] || missing+=("CLIPROXY_DOMAIN")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CLIPROXY_SSH_KEY }}

      - name: Deploy cliproxy
        run: bun run --cwd apps/cliproxy deploy
        env:
          CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}
          CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}

      - name: Post-deploy health check
        run: >-
          curl -sf -o /dev/null -w "%{http_code}" "https://${CLIPROXY_DOMAIN}/v0/management/config"
          -H "x-management-key: ${CLIPROXY_MANAGEMENT_KEY}" | grep -q "^200"
        env:
          CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}
          CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}
