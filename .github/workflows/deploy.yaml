name: Deploy

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy-keeweb:
    uses: ./.github/workflows/deploy-keeweb.yaml
    with:
      deploy_nginx: true
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

  deploy-cliproxy:
    uses: ./.github/workflows/deploy-cliproxy.yaml
    secrets:
      CLIPROXY_SSH_KEY: ${{ secrets.CLIPROXY_SSH_KEY }}
      CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}
      CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}
