services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    # Bound the json-file logs now that Caddy writes a management access log to stdout.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile
    networks:
      cliproxy:
        # Pinned because CLIProxyAPI's trusted-proxies (config.yaml) lists this address.
        ipv4_address: 172.28.0.2
    depends_on:
      cli-proxy-api:
        condition: service_started
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://cli-proxy-api:8317/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v8.0.44@sha256:be365a6b3ca2b54947e9248c7bb7e1cdb974f66c922d2354b85daec2ad5cc201
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy
    networks:
      - cliproxy

networks:
  cliproxy:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          # Dynamic addresses come from here, so cli-proxy-api never takes Caddy's pinned .2.
          ip_range: 172.28.0.128/25

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
