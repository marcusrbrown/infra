---
name: CLIProxy Anthropic auth monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      validation:
        description: Select live monitoring or an owner-only synthetic validation.
        required: true
        type: choice
        options:
          - live
          - synthetic-dead
          - synthetic-healthy
        default: live

permissions:
  contents: read
  issues: write

concurrency:
  group: cliproxy-auth-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: Probe CLIProxy Anthropic auth
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run CLIProxy auth monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          CLIPROXY_API_KEY: ${{ secrets.CLIPROXY_API_KEY }}
          CLIPROXY_AUTH_MONITOR_DISCORD_WEBHOOK: ${{ secrets.CLIPROXY_AUTH_MONITOR_DISCORD_WEBHOOK }}
          NO_COLOR: 1
        run: |
          set +e
          if [ "${{ github.event_name }}" = "schedule" ]; then
            VALIDATION=live
          else
            VALIDATION="${{ inputs.validation }}"
          fi

          bun run packages/cli/src/cli.ts cliproxy monitor --validation "$VALIDATION" > monitor-output.txt 2>&1
          STATUS=$?
          set -e
          OUTPUT=$(cat monitor-output.txt)
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          exit "$STATUS"
