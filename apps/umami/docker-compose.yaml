services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - umami

  umami:
    image: umamisoftware/umami:3.3.1@sha256:4f7d2b788f4ee84432f3119203656ed2083074f3656c63b3b5905be06b3b8462
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET:-}
      # Privacy posture: disable Umami's anonymous telemetry phone-home and
      # block outbound external calls (favicon/location lookups). Both are the
      # reason this deployment exists — do not remove.
      DISABLE_TELEMETRY: '1'
      PRIVATE_MODE: '1'
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: [CMD-SHELL, 'curl -f http://localhost:3000/api/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: unless-stopped
    # Postgres is reachable only on the internal compose network — port 5432 is
    # intentionally NOT published to the host. Caddy terminates TLS and proxies
    # to umami:3000; the database has no external surface.
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  umami-db-data:
