---
name: Renovate Changesets

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  renovate-changesets:
    name: Create Renovate Changeset
    runs-on: ubuntu-latest
    if: github.actor == 'renovate[bot]' || github.actor == 'mrbro-bot[bot]'
    steps:
      - id: get-app-token
        name: Get Workflow Access Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Setup Git user
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          GIT_USER_NAME: ${{ steps.get-app-token.outputs.app-slug }}[bot]
        run: |
          USER_ID=$(gh api "/users/${GIT_USER_NAME}" --jq .id)
          git config --global user.email "${USER_ID}+${GIT_USER_NAME}@users.noreply.github.com"
          git config --global user.name "${GIT_USER_NAME}"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          ref: ${{ github.head_ref }}
          token: ${{ steps.get-app-token.outputs.token }}

      - name: Generate Renovate changesets
        uses: bfra-me/.github/.github/actions/renovate-changesets@abb57164065c549e7e2867c21dd045e677c53bec # renovate-changesets@0.2.33
        with:
          token: ${{ steps.get-app-token.outputs.token }}
          commit-back: 'true'
          max-retries: '3'
          target-package: '@marcusrbrown/infra'
          # Exclude repo-level tooling from triggering changesets (workflow SHA pins,
          # root dev deps). Everything else — including apps/**/docker-compose.yaml
          # (Docker image bumps) and apps/**/package.json (runtime dep bumps) — flows
          # through so deployment updates show up in @marcusrbrown/infra release notes.
          exclude-patterns: '.github/**,bun.lock,package.json'
