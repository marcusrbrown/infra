services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      # .env is written by deploy.ts and includes GATEWAY_VPC_IP so Caddy can
      # expand {$GATEWAY_VPC_IP} in the Caddyfile /operator/* route target.
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      dashboard:
        condition: service_healthy
    # The dashboard server validates operator sessions by calling
    # https://dashboard.fro.bot/operator/session server-side. Without this alias,
    # that call hairpins to the droplet's public IP — DigitalOcean has no NAT
    # loopback, so it times out. The alias routes the call to Caddy via Docker DNS;
    # Caddy's /operator/* handle block proxies it to the gateway VPC.
    networks:
      default:
        aliases:
          - dashboard.fro.bot

  dashboard:
    image: ghcr.io/fro-bot/dashboard:2026.07.24@sha256:359be9b538a1e04dd5fda9c44447ed5431805077195446c7dd556ec4b5cd85ef
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    # Security hardening — deliberate delta from apps/umami:
    # The GitHub App private key is file-mounted (not an env var); these flags
    # minimize blast radius if the Hono app process is compromised.
    # DASHBOARD_GITHUB_APP_KEY_FILE=/run/secrets/github-app.pem is set in .env
    # so the app reads the key via file path, never via an env-string fallback.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: node
    tmpfs:
      - /tmp
    volumes:
      # Host path (uploaded by deploy.ts, 0600) : container path : read-only
      - /opt/dashboard/config/github-app.pem:/run/secrets/github-app.pem:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://localhost:3000/api/healthz'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      default:

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
    name: dashboard_default
