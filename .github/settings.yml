---
_extends: .github:common-settings.yaml

repository:
  name: infra
  description: Personal infrastructure management
  homepage: https://mrbro.dev/infra/
  topics: infra, keeweb, deploy, bun, github-actions

labels:
  - name: autoheal-report
    color: '#0e8a16'
    description: Trusted daily autohealing report
  - name: cliproxy-auth-monitor
    color: '#b60205'
    description: CLIProxy auth monitor state
  - name: autoheal-upstream-watch
    color: '#1d76db'
    description: Trusted weekly upstream modernization watch

branches:
  - name: main
    protection:
      required_status_checks:
        strict: false
        contexts:
          - CI
          - Fro Bot
          - Lint
          - Type Check
          - Renovate / Renovate

      enforce_admins: true
      required_pull_request_reviews: null
      restrictions: null
      required_linear_history: true
