services:
  caddy:
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      cli-proxy-api:
        condition: service_started
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://cli-proxy-api:8317/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.2.43@sha256:ba7b5f9b6c30f6795418348fe0101c157a0feffbfc9f1f024115438096bfc8d2
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
