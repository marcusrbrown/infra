---
name: Status Snapshot

on:
  schedule:
    - cron: '11,41 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Create the first status-history artifact. Refuses if a valid one already exists.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: status-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    name: Take status snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Locate status history
        id: locate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NO_COLOR: 1
        run: bun run packages/cli/src/cli.ts status history-locate

      - name: Check history state
        env:
          HISTORY_STATE: ${{ steps.locate.outputs.state }}
          BOOTSTRAP: ${{ inputs.bootstrap == true }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Status snapshots run on main only."
            exit 1
          fi
          if [ "$HISTORY_STATE" = "empty" ] && [ "$BOOTSTRAP" != "true" ]; then
            echo "::error::No status history exists. Run this workflow manually with bootstrap enabled."
            exit 1
          fi
          if [ "$HISTORY_STATE" = "found" ] && [ "$BOOTSTRAP" = "true" ]; then
            echo "::error::A valid status history exists. Refusing to bootstrap over it."
            exit 1
          fi
          if [ "$HISTORY_STATE" != "found" ] && [ "$HISTORY_STATE" != "empty" ]; then
            echo "::error::Status history lookup gave no usable state."
            exit 1
          fi

      - name: Download status history
        if: steps.locate.outputs.state == 'found'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status-history
          path: ${{ runner.temp }}/status-history
          run-id: ${{ steps.locate.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Take snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOOTSTRAP: ${{ inputs.bootstrap == true }}
          NO_COLOR: 1
        run: |
          args=()
          if [ "$BOOTSTRAP" = "true" ]; then
            args+=(--bootstrap)
          fi
          bun run packages/cli/src/cli.ts status snapshot --history ${{ runner.temp }}/status-history "${args[@]}" > "$RUNNER_TEMP/snapshot-output.txt"
          cat "$RUNNER_TEMP/snapshot-output.txt"

      - name: Write step summary
        run: |
          {
            echo '### Status snapshot'
            echo
            sed 's/^/- /' "$RUNNER_TEMP/snapshot-output.txt"
          } >> "$GITHUB_STEP_SUMMARY"

      # Upload stays last: history-locate rejects an artifact whose run did not succeed.
      - name: Upload status history
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: status-history
          path: ${{ runner.temp }}/status-history
          retention-days: 7
          if-no-files-found: error
