---
# Daily refresh of the OpenCode Go privacy snapshot (packages/shared/opencode-go/privacy-snapshot.json).
#
# Resolves the anomalyco/opencode `dev` head, builds the snapshot from its Go docs page and the public Go model list
# and, when a model's privacy terms changed, opens or updates ONE stable PR for review. The PR carries the snapshot and
# one patch changeset for the published CLI, which inlines the snapshot: merging it queues a CLI release through the
# Version Packages PR. The branch is rebuilt from main on every run, and every run names its changeset after its own
# run id and attempt, so the file is never one main already holds. When upstream terms match main again, an open stable PR is stale: the run closes it and deletes
# its branch. Nothing here deploys or merges: a merged snapshot PR reaches the gated cliproxy deploy through the
# router's paths-filter, and auto-merge stays off.
#
# renovate-changesets.yaml also fires on this PR (the App opens it) and skips it: the branch lacks the `renovate/`
# prefix. That workflow must keep its prefix check, or it could rewrite the changeset this run adds.
#
# Credentials: checkout persists none. The refresh step and the stale-PR lookup carry only the read-only workflow
# token. A scoped GitHub App token is minted only after the parse succeeded and either the snapshot changed or a stale
# PR is open, and reaches git and gh inside the PR step and the close step alone.
name: OpenCode Go Privacy

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opencode-go-privacy
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh privacy snapshot
    # The PR branch is cut from main; a dispatch from any other ref would compare against the wrong snapshot.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The stale-PR lookup lists pull requests with the read-only workflow token.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # A parse failure exits non-zero here, so the run fails before any token is minted.
      - name: Refresh privacy snapshot
        id: refresh
        env:
          # Read-only token for the api.github.com lookup, so shared runner IPs do not hit the anonymous limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run refresh:go-privacy "${RUNNER_TEMP}/pr-body.md"

      # Unchanged terms mean main already carries them. An open stable PR then holds superseded terms.
      - name: Find stale snapshot PR
        id: stale-pr
        if: steps.refresh.outputs.changed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branch="opencode-go-privacy"

          # A same-repository PR only: a fork's branch of the same name is not ours to close.
          if ! number=$(gh pr list --state open --head "${branch}" --base main --json number,isCrossRepository --jq '[.[] | select(.isCrossRepository | not)] | .[0].number // empty'); then
            echo "Unable to look up the stable snapshot PR." >&2
            exit 1
          fi

          if [[ -z "${number}" ]]; then
            echo "stale=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          if [[ ! "${number}" =~ ^[0-9]+$ ]]; then
            echo "Unexpected PR number from the lookup." >&2
            exit 1
          fi

          echo "Snapshot PR #${number} is stale: upstream terms match main."
          echo "stale=true" >> "${GITHUB_OUTPUT}"
          echo "number=${number}" >> "${GITHUB_OUTPUT}"

      - name: Get app token
        id: get-app-token
        if: steps.refresh.outputs.changed == 'true' || steps.stale-pr.outputs.stale == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Open snapshot PR
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          GIT_USER_NAME: ${{ format('{0}[bot]', steps.get-app-token.outputs.app-slug) }}
          CHANGESET_FILE: ${{ steps.refresh.outputs.changeset }}
        run: |
          set -euo pipefail

          branch="opencode-go-privacy"
          snapshot="packages/shared/opencode-go/privacy-snapshot.json"
          body_file="${RUNNER_TEMP}/pr-body.md"
          new_snapshot="${RUNNER_TEMP}/privacy-snapshot.json"
          title="chore(cliproxy): refresh OpenCode Go privacy snapshot"

          # The refresh wrote one changeset named after the upstream commit, the run id and the attempt. A changed
          # snapshot without one fails the run rather than opening a PR that would not queue a release; any other name
          # never reaches a path or git add.
          if [[ ! "${CHANGESET_FILE}" =~ ^opencode-go-privacy-[0-9a-f]{7}-[0-9]{1,20}-[0-9]{1,4}\.md$ ]]; then
            echo "The refresh did not report a valid changeset file name." >&2
            exit 1
          fi
          changeset=".changeset/${CHANGESET_FILE}"
          new_changeset="${RUNNER_TEMP}/${CHANGESET_FILE}"

          # Hand the token to git for this step only, through the environment so it never appears in argv.
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')"
          echo "::add-mask::${auth}"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"

          USER_ID=$(gh api "/users/${GIT_USER_NAME}" --jq .id)
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${USER_ID}+${GIT_USER_NAME}@users.noreply.github.com"

          # Keep the refreshed files; the branch checkout below resets the worktree.
          cp "${snapshot}" "${new_snapshot}"
          cp "${changeset}" "${new_changeset}"

          git fetch origin main
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          else
            # Remove any stale local tracking ref so a first push can lease-create the branch.
            git update-ref -d "refs/remotes/origin/${branch}"
          fi
          git checkout -f -B "${branch}" origin/main
          cp "${new_snapshot}" "${snapshot}"
          cp "${new_changeset}" "${changeset}"

          # Only the snapshot and its changeset are committed, whatever else the worktree holds.
          git add -- "${snapshot}" "${changeset}"
          # The snapshot itself must differ from main. A staged changeset alone proves nothing: main may have taken
          # this snapshot since the refresh ran (a hand-merged copy, a rerun), and a PR of only a changeset is wrong.
          # An open snapshot PR is left for the next run, whose refresh then reports unchanged and closes it.
          if git diff --cached --quiet -- "${snapshot}"; then
            echo "main already carries this snapshot; nothing to propose. Any open snapshot PR is closed by the next run."
            exit 0
          fi
          # A snapshot change must travel with a changeset that main does not have. This should never fire, since each
          # run names its own file; if it does, fail instead of opening a PR that queues no release.
          if [[ -z "$(git diff --cached --diff-filter=A --name-only -- "${changeset}")" ]]; then
            echo "The staged changes do not add ${changeset}; refusing to open a PR that queues no release." >&2
            exit 1
          fi

          git commit -m "${title}"
          git push origin "${branch}" --force-with-lease

          if ! existing=$(gh pr list --state open --head "${branch}" --base main --json number --jq '.[0].number // empty'); then
            echo "Unable to look up the stable snapshot PR." >&2
            exit 1
          fi
          if [[ -n "${existing}" ]]; then
            echo "Updating snapshot PR #${existing}."
            gh pr edit "${existing}" --title "${title}" --body-file "${body_file}"
          else
            gh pr create --title "${title}" --body-file "${body_file}" --head "${branch}" --base main
          fi

      # Close before deleting the branch: deleting the head branch first would close the PR without the comment.
      - name: Close stale snapshot PR
        if: steps.stale-pr.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          PR_NUMBER: ${{ steps.stale-pr.outputs.number }}
        run: |
          set -euo pipefail

          branch="opencode-go-privacy"

          gh pr close "${PR_NUMBER}" --comment "Closing: the upstream OpenCode Go privacy terms now match main, so this refresh is obsolete. A later change to the terms opens a new PR."
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
