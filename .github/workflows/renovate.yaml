---
name: Renovate
run-name: Renovate

on:
  issues:
    types: [edited]
  pull_request:
    types: [edited]
  push:
    # changesets/action pushes through a short-lived changesets-ghcommit-temp/* branch and
    # deletes it immediately, so a run triggered on one fails checkout with
    # "couldn't find remote ref" before Renovate ever starts.
    branches-ignore: [main, changesets-ghcommit-temp/**]
  workflow_dispatch:
    inputs:
      log-level:
        description: Log level for Renovate
        required: false
        type: string
        default: debug
      print-config:
        description: Log the fully-resolved Renovate config for each repository, plus fully-resolved presets.
        required: false
        type: boolean
        default: false
  workflow_run:
    branches: [main]
    types: [completed]
    workflows: [Deploy]

permissions:
  contents: read

jobs:
  renovate:
    # Dashboard and PR edits are gated by the called workflow, which runs only when the body has a
    # ticked checkbox; Renovate's own dashboard edits untick them, so they skip there.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Renovate
    secrets:
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}
    uses: bfra-me/.github/.github/workflows/renovate.yaml@e62de417e8e22026f63890558ace7c574ee2a31f # v4.39.0
    with:
      log-level: ${{ inputs.log-level || 'debug' }}
      print-config: ${{ inputs.print-config || false }}
