# Dispatch input contract:
#
#   version          CalVer string (YYYY.MM.N, e.g. 2026.06.47). Optional.
#                    When set, the deploy resolves the GHCR image digest,
#                    cross-checks it against `digest` (if provided), generates
#                    a pinned docker-compose.yaml, and opens an audit PR to
#                    record the updated pin.
#
#   digest           Expected sha256 digest (e.g. sha256:abc...). Optional.
#                    When set alongside `version`, the resolved digest must
#                    match this value exactly — mismatch fails hard.
#
# No-version fallback: omit both inputs (or leave empty). The committed
# docker-compose.yaml digest is the source of truth; no audit PR is opened.
#

name: Deploy Dashboard

run-name: Deploy dashboard ${{ inputs.version || 'latest pin' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: CalVer version to deploy (e.g. 2026.06.47). Leave empty to use committed pin.
        required: false
        type: string
        default: ''
      digest:
        description: Expected sha256 digest (e.g. sha256:abc...). Leave empty to skip cross-check.
        required: false
        type: string
        default: ''
  workflow_call:
    inputs:
      version:
        description: CalVer version to deploy (e.g. 2026.06.47). Leave empty to use committed pin.
        required: false
        type: string
        default: ''
      digest:
        description: Expected sha256 digest (e.g. sha256:abc...). Leave empty to skip cross-check.
        required: false
        type: string
        default: ''
    secrets:
      DASHBOARD_SSH_KEY:
        required: true
      DASHBOARD_DOMAIN:
        required: true
      DASHBOARD_GITHUB_APP_ID:
        required: true
      DASHBOARD_GITHUB_APP_KEY:
        required: true
      DASHBOARD_OAUTH_CLIENT_ID:
        required: true
      DASHBOARD_OAUTH_CLIENT_SECRET:
        required: true
      DASHBOARD_OPERATOR_LOGIN:
        required: true
      DASHBOARD_COOKIE_KEY:
        required: true
      GATEWAY_VPC_IP:
        required: false
      APPLICATION_ID:
        required: true
      APPLICATION_PRIVATE_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-dashboard-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Pre-gate: no-secret validation. Runs before the environment gate so the
  # approver sees the version and any input errors before spending an approval.
  validate-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Log version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          printf 'version: %s\n' "${INPUT_VERSION:-"(none — using committed pin)"}"
          printf 'digest:  %s\n' "${INPUT_DIGEST:-"(none — no cross-check)"}"

      - name: Validate digest format
        if: inputs.digest != ''
        env:
          INPUT_DIGEST: ${{ inputs.digest }}
        run: |
          digest="${INPUT_DIGEST}"
          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Invalid digest %q: must match sha256:<64 hex chars> (e.g. sha256:abc...def).\n' "$digest"
            echo "Rejected: malformed digests are not accepted."
            exit 1
          fi

      - name: Validate CalVer format
        if: inputs.version != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION}"
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            printf 'Invalid version %q: must match YYYY.MM.N (e.g. 2026.06.47).\n' "$version"
            echo "Rejected: 'latest', semver, and injection strings are not accepted."
            exit 1
          fi

      - name: Validate input mode
        if: inputs.version == '' && inputs.digest != ''
        run: |
          echo "Invalid deploy input mode: version is required when digest is set."
          echo "Either omit all inputs (no-version fallback) or provide version (+ optional digest)."
          exit 1

  deploy-dashboard:
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: dashboard
    steps:
      - name: Get app token
        id: get-app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.get-app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate required secrets
        env:
          DASHBOARD_SSH_KEY: ${{ secrets.DASHBOARD_SSH_KEY }}
          DASHBOARD_DOMAIN: ${{ secrets.DASHBOARD_DOMAIN }}
          DASHBOARD_GITHUB_APP_ID: ${{ secrets.DASHBOARD_GITHUB_APP_ID }}
          DASHBOARD_GITHUB_APP_KEY: ${{ secrets.DASHBOARD_GITHUB_APP_KEY }}
          DASHBOARD_OAUTH_CLIENT_ID: ${{ secrets.DASHBOARD_OAUTH_CLIENT_ID }}
          DASHBOARD_OAUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_OAUTH_CLIENT_SECRET }}
          DASHBOARD_OPERATOR_LOGIN: ${{ secrets.DASHBOARD_OPERATOR_LOGIN }}
          DASHBOARD_COOKIE_KEY: ${{ secrets.DASHBOARD_COOKIE_KEY }}
          APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
          APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}
        run: |
          missing=()
          [[ -n "${DASHBOARD_SSH_KEY}" ]] || missing+=("DASHBOARD_SSH_KEY")
          [[ -n "${DASHBOARD_DOMAIN}" ]] || missing+=("DASHBOARD_DOMAIN")
          [[ -n "${DASHBOARD_GITHUB_APP_ID}" ]] || missing+=("DASHBOARD_GITHUB_APP_ID")
          [[ -n "${DASHBOARD_GITHUB_APP_KEY}" ]] || missing+=("DASHBOARD_GITHUB_APP_KEY")
          [[ -n "${DASHBOARD_OAUTH_CLIENT_ID}" ]] || missing+=("DASHBOARD_OAUTH_CLIENT_ID")
          [[ -n "${DASHBOARD_OAUTH_CLIENT_SECRET}" ]] || missing+=("DASHBOARD_OAUTH_CLIENT_SECRET")
          [[ -n "${DASHBOARD_OPERATOR_LOGIN}" ]] || missing+=("DASHBOARD_OPERATOR_LOGIN")
          [[ -n "${DASHBOARD_COOKIE_KEY}" ]] || missing+=("DASHBOARD_COOKIE_KEY")
          [[ -n "${APPLICATION_ID}" ]] || missing+=("APPLICATION_ID")
          [[ -n "${APPLICATION_PRIVATE_KEY}" ]] || missing+=("APPLICATION_PRIVATE_KEY")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Deploy
        env:
          DASHBOARD_SSH_KEY: ${{ secrets.DASHBOARD_SSH_KEY }}
          DASHBOARD_DOMAIN: ${{ secrets.DASHBOARD_DOMAIN }}
          DASHBOARD_GITHUB_APP_ID: ${{ secrets.DASHBOARD_GITHUB_APP_ID }}
          DASHBOARD_GITHUB_APP_KEY: ${{ secrets.DASHBOARD_GITHUB_APP_KEY }}
          DASHBOARD_OAUTH_CLIENT_ID: ${{ secrets.DASHBOARD_OAUTH_CLIENT_ID }}
          DASHBOARD_OAUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_OAUTH_CLIENT_SECRET }}
          DASHBOARD_OPERATOR_LOGIN: ${{ secrets.DASHBOARD_OPERATOR_LOGIN }}
          DASHBOARD_COOKIE_KEY: ${{ secrets.DASHBOARD_COOKIE_KEY }}
          GATEWAY_VPC_IP: ${{ secrets.GATEWAY_VPC_IP }}
          DEPLOY_VERSION: ${{ inputs.version }}
          DEPLOY_DIGEST: ${{ inputs.digest }}
        run: bun run --cwd apps/dashboard deploy

      - name: Open audit PR for compose pin
        if: inputs.version != ''
        env:
          GH_TOKEN: ${{ steps.get-app-token.outputs.token }}
          INPUT_VERSION: ${{ inputs.version }}
          GIT_USER_NAME: ${{ format('{0}[bot]', steps.get-app-token.outputs.app-slug) }}
        run: |
          version="${INPUT_VERSION}"
          compose_file="apps/dashboard/docker-compose.yaml"

          # Revalidate CalVer before constructing branch/commit strings.
          # Prevents unsanitized ref names from reaching git/gh argv.
          if ! [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]+$ ]]; then
            printf 'Audit step: invalid version %q — must match YYYY.MM.N.\n' "$version"
            exit 1
          fi

          # Capture the exact pin produced by Deploy before resetting the worktree.
          if ! pinned_image_line="$(awk '
            /^[[:space:]]*image:[[:space:]]+ghcr[.]io\/fro-bot\/dashboard:[^[:space:]]+@sha256:[0-9a-fA-F]+[[:space:]]*$/ {
              print
              found=1
              exit
            }
            END {
              if (!found) exit 1
            }
          ' "${compose_file}")"; then
            echo "Audit step: dashboard image pin line not found in the deployed compose."
            exit 1
          fi

          branch="dashboard-pin"
          commit_msg="chore(dashboard): pin image to ${version}"
          commit_body="Pins the dashboard image to \`${version}\` after a successful deploy. Merge to record the audit trail in main."

          USER_ID=$(gh api "/users/${GIT_USER_NAME}" --jq .id)
          git config user.name "${GIT_USER_NAME}"
          git config user.email "${USER_ID}+${GIT_USER_NAME}@users.noreply.github.com"

          git fetch origin main
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
          else
            # Remove any stale local tracking ref so a first push can lease-create the branch.
            git update-ref -d "refs/remotes/origin/${branch}"
          fi
          git checkout -B "${branch}" origin/main

          origin_compose="$(mktemp)"
          if ! git show "origin/main:apps/dashboard/docker-compose.yaml" > "${origin_compose}"; then
            rm -f "${origin_compose}"
            echo "Audit step: dashboard compose not found on origin/main."
            exit 1
          fi

          rewritten_compose="$(mktemp)"
          if ! awk -v replacement="${pinned_image_line}" '
            /^[[:space:]]*image:[[:space:]]+ghcr[.]io\/fro-bot\/dashboard:/ {
              print replacement
              count++
              next
            }
            { print }
            END {
              if (count != 1) {
                printf "Audit step: expected exactly one dashboard image line on origin/main, found %d.\n", count > "/dev/stderr"
                exit 1
              }
            }
          ' "${origin_compose}" > "${rewritten_compose}"; then
            rm -f "${origin_compose}" "${rewritten_compose}"
            exit 1
          fi
          mv "${rewritten_compose}" "${compose_file}"
          rm -f "${origin_compose}"

          supersede_open_pin_prs() {
            local stable_pr_number="$1"
            local pr_rows pr_number head_ref
            if ! pr_rows=$(gh pr list --state open --limit 1000 --json number,headRefName --jq '.[] | select(.headRefName == "dashboard-pin" or (.headRefName | startswith("dashboard-pin-"))) | [.number, .headRefName] | @tsv'); then
              echo "Audit step: unable to list open dashboard pin PRs." >&2
              return 1
            fi
            while IFS=$'\t' read -r pr_number head_ref; do
              [[ -n "${pr_number}" ]] || continue
              if [[ -n "${stable_pr_number}" && "${pr_number}" == "${stable_pr_number}" ]]; then
                continue
              fi
              echo "Closing superseded dashboard pin PR #${pr_number} (${head_ref})"
              gh pr close "${pr_number}" --comment "Superseded by the current dashboard pin PR."
            done <<< "${pr_rows}"
          }

          git add "${compose_file}"

          if git diff --cached --quiet; then
            echo "No changes to commit — compose pin already up to date."
            supersede_open_pin_prs ""
            exit 0
          fi

          git commit -m "${commit_msg}"
          git push origin "${branch}" --force-with-lease

          # Create or update the stable-branch PR before closing superseded pin PRs.
          if ! existing=$(gh pr list --state open --head "${branch}" --base main --json number --jq '.[0].number // empty'); then
            echo "Audit step: unable to look up the stable dashboard pin PR." >&2
            exit 1
          fi

          stable_pr_number=""
          if [[ -n "${existing}" ]]; then
            echo "Updating audit PR #${existing}."
            gh pr edit "${existing}" \
              --title "${commit_msg}" \
              --body "${commit_body}"
            stable_pr_number="${existing}"
          else
            gh pr create \
              --title "${commit_msg}" \
              --body "${commit_body}" \
              --head "${branch}" \
              --base main
            if ! stable_pr_number=$(gh pr list --state open --head "${branch}" --base main --json number --jq '.[0].number // empty'); then
              echo "Audit step: unable to confirm the stable dashboard pin PR after creation." >&2
              exit 1
            fi
          fi

          if [[ -z "${stable_pr_number}" ]]; then
            echo "Audit step: stable dashboard pin PR number was not confirmed." >&2
            exit 1
          fi

          supersede_open_pin_prs "${stable_pr_number}"
