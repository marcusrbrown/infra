services:
  caddy:
    image: caddy:2.11.4-alpine@sha256:eb37f58646a901dc7727cf448cae36daaefaba79de33b5058dab79aa4c04aefb
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.1.43@sha256:47a87d35b8de6c97028ee63c5d8f40ec135e59829166e2fa246a7c6129a2663f
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8317/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
