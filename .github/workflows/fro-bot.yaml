    | --- | --- | --- | --- |
    | [repo] | [what they do that we don't] | [specific action or "monitor"] | High/Med/Low |

    ### Upstream Modernization Watch
    [Sunday-only section. On Sundays UTC, link to the tracking issue
    if findings exist, or write "Scan clean" if no actionable items.
    On other days, omit this entire section from the daily summary.]

    ### Needs Human Attention
    - [items that could not be auto-fixed, with context]

    Do NOT create multiple open trusted managed daily reports. Apply the
    SINGLE-REPORT RECONCILIATION CONTRACT above so exactly one trusted
    managed report is open at the end of the run. Leave untrusted prefix
    collisions untouched and list them under "Needs Human Attention".

jobs:
  fro-bot-content:
    name: Fro Bot
    runs-on: ubuntu-latest
    if: >-
      (
        github.event.pull_request == null ||
        (
          !github.event.pull_request.head.repo.fork &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]')
        )
      ) && (
        (
          github.event_name == 'issues' &&
          !endsWith(github.event.issue.user.login || '', '[bot]') &&
          (github.event.issue.user.login || '') != 'fro-bot'
        ) ||
        (
          github.event_name == 'pull_request' &&
          !endsWith(github.event.pull_request.user.login || '', '[bot]') &&
          (github.event.pull_request.user.login || '') != 'fro-bot'
        ) ||
        (
          (github.event_name == 'issue_comment' ||
           github.event_name == 'pull_request_review_comment' ||
           github.event_name == 'discussion_comment') &&
          contains(github.event.comment.body || '', '@fro-bot') &&
          (github.event.comment.user.login || '') != 'fro-bot' &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association || '')
        )
      )
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Always check out the default ref. Resolving a PR head here is unsafe:
      # an issue_comment on a fork PR is exposed only at github.event.issue.pull_request,
      # so the job-level fork guard (which reads github.event.pull_request) does not apply,
      # and a PR-head ref would pull fork-controlled code into a secret-bearing run.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.FRO_BOT_PAT }}

      - name: Resolve same-repo PR-head ref
        id: prehead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          IS_PR_COMMENT: ${{ github.event.issue.pull_request != null }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          ref=""
          pr_number=""
          if [ "${EVENT_NAME}" = "issue_comment" ] && [ "${IS_PR_COMMENT}" = "true" ]; then
            pr_number="${ISSUE_NUMBER}"
          elif [ "${EVENT_NAME}" = "pull_request_review_comment" ]; then
            pr_number="${PR_NUMBER}"
          fi
          if [ -n "${pr_number}" ]; then
            if pr_json="$(gh api "repos/${REPO}/pulls/${pr_number}" 2>/dev/null)"; then
              head_repo="$(printf '%s' "${pr_json}" | jq -r '.head.repo.full_name // empty')"
              if [ "${head_repo}" = "${REPO}" ]; then
                ref="$(printf '%s' "${pr_json}" | jq -r '.head.sha // empty')"
              else
                echo "PR ${pr_number} head repo '${head_repo:-unknown}' is not this repository — using default branch." >&2
              fi
            else
              echo "Could not resolve PR ${pr_number} head (API error) — using default branch." >&2
            fi
          fi
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      # Pin Node.js because Fro Bot runs `bun run lint` / `bunx tsc` which
      # spawn eslint/tsc via #!/usr/bin/env node shebang. ubuntu-latest
      # ships Node 20 which lacks ES2024 APIs (Object.groupBy) used by
      # eslint-flat-config-utils 3.1.0+.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run Fro Bot
        uses: fro-bot/agent@504e86abcf0c62ce6f8e3f1a47b991d24dc5af82 # v0.108.1
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          PROMPT: >-
            ${{
              (github.event_name == 'pull_request' && env.PR_REVIEW_PROMPT) || ''
            }}
        with:
          github-token: ${{ secrets.FRO_BOT_PAT }}
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          model: ${{ vars.FRO_BOT_MODEL }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.PROMPT }}
          trusted-head-sha: ${{ steps.prehead.outputs.ref }}
          timeout: 0
          # Mirror upstream's `packages/*/src` convention; deploy-critical files under `apps/` remain intentionally excluded.
          # Root AGENTS.md joins the per-app ones — upstream's default covers README/ARCHITECTURE/STRUCTURE only.
          brokered-push-extra-paths: >-
            AGENTS.md,
            apps/agent/src, apps/agent/AGENTS.md,
            apps/broker/src, apps/broker/AGENTS.md,
            apps/cliproxy/src, apps/cliproxy/AGENTS.md,
            apps/dashboard/src, apps/dashboard/AGENTS.md,
            apps/gateway/src, apps/gateway/AGENTS.md,
            apps/keeweb/src, apps/keeweb/AGENTS.md,
            apps/umami/src, apps/umami/AGENTS.md,
            apps/vpn/src, apps/vpn/AGENTS.md
  fro-bot-storage:
    name: Fro Bot (storage)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment: fro-bot-storage
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 90
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: true
          allowed-endpoints: >-
            api.github.com:443 github.com:443 *.githubusercontent.com:443
            *.actions.githubusercontent.com:443 nodejs.org:443 registry.npmjs.org:443
            cliproxy.fro.bot:443 sts.amazonaws.com:443
            sts.${{ vars.FRO_BOT_S3_REGION }}.amazonaws.com:443 s3.amazonaws.com:443
            s3.${{ vars.FRO_BOT_S3_REGION }}.amazonaws.com:443
            ${{ vars.FRO_BOT_S3_BUCKET }}.s3.${{ vars.FRO_BOT_S3_REGION }}.amazonaws.com:443
            kw.igg.ms:443 metrics.fro.bot:443 dashboard.fro.bot:443 broker.fro.bot:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.FRO_BOT_PAT }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.FRO_BOT_S3_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.FRO_BOT_S3_REGION }}
          role-duration-seconds: 7200
          role-session-name: fro-bot-${{ github.run_id }}

      - name: Run Fro Bot
        uses: fro-bot/agent@504e86abcf0c62ce6f8e3f1a47b991d24dc5af82 # v0.108.1
        env:
          OPENCODE_PROMPT_ARTIFACT: 'true'
          PROMPT: >-
            ${{
              (github.event_name == 'workflow_dispatch' && github.event.inputs.prompt)
              || env.SCHEDULE_PROMPT
            }}
        with:
          github-token: ${{ secrets.FRO_BOT_PAT }}
          auth-json: ${{ secrets.OPENCODE_AUTH_JSON }}
          model: ${{ vars.FRO_BOT_MODEL }}
          opencode-config: ${{ secrets.OPENCODE_CONFIG }}
          prompt: ${{ env.PROMPT }}
          timeout: 0
          s3-backup: true
          s3-bucket: ${{ vars.FRO_BOT_S3_BUCKET }}
          aws-region: ${{ vars.FRO_BOT_S3_REGION }}
          s3-prefix: ${{ vars.FRO_BOT_S3_PREFIX }}
          s3-expected-bucket-owner: ${{ vars.FRO_BOT_S3_EXPECTED_BUCKET_OWNER }}
