services:
  caddy:
    image: caddy:2.11.3-alpine@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v7.1.39@sha256:f204cbf810cf1140bb8cf1fd114ad05306bd78b564a3388891b12a3f18f4afe3
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8317/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
