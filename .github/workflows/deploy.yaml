name: Deploy

permissions:
  contents: read

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      keeweb: ${{ steps.filter.outputs.keeweb }}
      keeweb_nginx: ${{ steps.filter.outputs.keeweb_nginx }}
      cliproxy: ${{ steps.filter.outputs.cliproxy }}
      gateway: ${{ steps.filter.outputs.gateway }}
      umami: ${{ steps.filter.outputs.umami }}
      vpn: ${{ steps.filter.outputs.vpn }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      broker: ${{ steps.filter.outputs.broker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: every
          filters: |
            keeweb:
              - 'apps/keeweb/**'
              - '!apps/keeweb/**/*.md'
              - '!apps/keeweb/**/*.test.ts'
              - '!apps/keeweb/**/__fixtures__/**'
              - '!apps/keeweb/**/__snapshots__/**'
            keeweb_nginx:
              - 'apps/keeweb/config/kw.igg.ms.conf'
            cliproxy:
              - '{apps/cliproxy,packages/shared/cliproxy}/**'
              - '!**/*.md'
              - '!**/*.test.ts'
              - '!**/__fixtures__/**'
              - '!**/__snapshots__/**'
            gateway:
              - 'apps/gateway/**'
              - '!apps/gateway/**/*.md'
              - '!apps/gateway/**/*.test.ts'
              - '!apps/gateway/**/__fixtures__/**'
              - '!apps/gateway/**/__snapshots__/**'
            umami:
              - 'apps/umami/**'
              - '!apps/umami/**/*.md'
              - '!apps/umami/**/*.test.ts'
              - '!apps/umami/**/__fixtures__/**'
              - '!apps/umami/**/__snapshots__/**'
            vpn:
              - '{apps/vpn,packages/cli/src/commands/vpn}/**'
              - '!**/*.md'
              - '!**/*.test.ts'
              - '!**/__fixtures__/**'
              - '!**/__snapshots__/**'
            dashboard:
              - 'apps/dashboard/**'
              - '!apps/dashboard/**/*.md'
              - '!apps/dashboard/**/*.test.ts'
              - '!apps/dashboard/**/__fixtures__/**'
              - '!apps/dashboard/**/__snapshots__/**'
            broker:
              - '{apps/broker,packages/shared/cliproxy}/**'
              - '!**/*.md'
              - '!**/*.test.ts'
              - '!**/__fixtures__/**'
              - '!**/__snapshots__/**'

  # Keep deploys independent by design: one app failing should not block the other.
  deploy-keeweb:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.keeweb == 'true'
    uses: ./.github/workflows/deploy-keeweb.yaml
    with:
      deploy_nginx: ${{ github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.keeweb_nginx == 'true' }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

  deploy-cliproxy:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.cliproxy == 'true'
    uses: ./.github/workflows/deploy-cliproxy.yaml
    secrets:
      CLIPROXY_SSH_KEY: ${{ secrets.CLIPROXY_SSH_KEY }}
      CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}
      CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}

  deploy-gateway:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.gateway == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy-gateway.yaml
    secrets:
      GATEWAY_SSH_KEY: ${{ secrets.GATEWAY_SSH_KEY }}
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      S3_REGION: ${{ secrets.S3_REGION }}
      GATEWAY_HOST: ${{ secrets.GATEWAY_HOST }}
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
      S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
      OBJECT_STORE_HOSTS: ${{ secrets.OBJECT_STORE_HOSTS }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      DISCORD_PRIVILEGED_INTENTS: ${{ secrets.DISCORD_PRIVILEGED_INTENTS }}
      WORKSPACE_OPENCODE_TOKEN: ${{ secrets.WORKSPACE_OPENCODE_TOKEN }}
      WORKSPACE_OPENCODE_AUTH: ${{ secrets.WORKSPACE_OPENCODE_AUTH }}
      WORKSPACE_OPENCODE_MODEL: ${{ secrets.WORKSPACE_OPENCODE_MODEL }}
      WORKSPACE_OPENCODE_CONFIG: ${{ secrets.WORKSPACE_OPENCODE_CONFIG }}
      GATEWAY_TRIGGER_ROLE_ID: ${{ secrets.GATEWAY_TRIGGER_ROLE_ID }}
      GATEWAY_WEBHOOK_SECRET: ${{ secrets.GATEWAY_WEBHOOK_SECRET }}
      GATEWAY_PRESENCE_CHANNEL_ID: ${{ secrets.GATEWAY_PRESENCE_CHANNEL_ID }}
      GATEWAY_OPERATOR_BIND_HOST: ${{ secrets.GATEWAY_OPERATOR_BIND_HOST }}
      GATEWAY_OPERATOR_BIND_PORT: ${{ secrets.GATEWAY_OPERATOR_BIND_PORT }}
      GATEWAY_OPERATOR_PUBLIC_ORIGIN: ${{ secrets.GATEWAY_OPERATOR_PUBLIC_ORIGIN }}
      GATEWAY_OPERATOR_GITHUB_CLIENT_ID: ${{ secrets.GATEWAY_OPERATOR_GITHUB_CLIENT_ID }}
      GATEWAY_OPERATOR_GITHUB_CLIENT_SECRET: ${{ secrets.GATEWAY_OPERATOR_GITHUB_CLIENT_SECRET }}
      GATEWAY_OPERATOR_CSRF_SECRET: ${{ secrets.GATEWAY_OPERATOR_CSRF_SECRET }}
      GATEWAY_OPERATOR_ALLOWLIST: ${{ secrets.GATEWAY_OPERATOR_ALLOWLIST }}
      GATEWAY_OPERATOR_OAUTH_ALLOWED_RETURN_PATHS: ${{ secrets.GATEWAY_OPERATOR_OAUTH_ALLOWED_RETURN_PATHS }}
      GATEWAY_OPERATOR_OAUTH_STATE_TTL_MS: ${{ secrets.GATEWAY_OPERATOR_OAUTH_STATE_TTL_MS }}
      GATEWAY_OPERATOR_OAUTH_MAX_OUTSTANDING_ATTEMPTS: ${{ secrets.GATEWAY_OPERATOR_OAUTH_MAX_OUTSTANDING_ATTEMPTS }}
      GATEWAY_OPERATOR_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.GATEWAY_OPERATOR_PUSH_VAPID_PRIVATE_KEY }}
      GATEWAY_VPC_IP: ${{ secrets.GATEWAY_VPC_IP }}
      DASHBOARD_VPC_IP: ${{ secrets.DASHBOARD_VPC_IP }}

  deploy-umami:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.umami == 'true'
    uses: ./.github/workflows/deploy-umami.yaml
    secrets:
      UMAMI_SSH_KEY: ${{ secrets.UMAMI_SSH_KEY }}
      UMAMI_DOMAIN: ${{ secrets.UMAMI_DOMAIN }}
      UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
      UMAMI_DB_PASSWORD: ${{ secrets.UMAMI_DB_PASSWORD }}
      UMAMI_ADMIN_PASSWORD: ${{ secrets.UMAMI_ADMIN_PASSWORD }}

  deploy-vpn:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.vpn == 'true'
    uses: ./.github/workflows/deploy-vpn.yaml
    secrets:
      VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
      VPN_HOST: ${{ secrets.VPN_HOST }}
      VPN_PEERS: ${{ secrets.VPN_PEERS }}

  deploy-dashboard:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (needs.detect-changes.outputs.dashboard == 'true' &&
       !startsWith(github.event.head_commit.message, 'chore(dashboard): pin image to '))
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/deploy-dashboard.yaml
    secrets:
      DASHBOARD_SSH_KEY: ${{ secrets.DASHBOARD_SSH_KEY }}
      DASHBOARD_DOMAIN: ${{ secrets.DASHBOARD_DOMAIN }}
      DASHBOARD_GITHUB_APP_ID: ${{ secrets.DASHBOARD_GITHUB_APP_ID }}
      DASHBOARD_GITHUB_APP_KEY: ${{ secrets.DASHBOARD_GITHUB_APP_KEY }}
      DASHBOARD_OAUTH_CLIENT_ID: ${{ secrets.DASHBOARD_OAUTH_CLIENT_ID }}
      DASHBOARD_OAUTH_CLIENT_SECRET: ${{ secrets.DASHBOARD_OAUTH_CLIENT_SECRET }}
      DASHBOARD_OPERATOR_LOGIN: ${{ secrets.DASHBOARD_OPERATOR_LOGIN }}
      DASHBOARD_COOKIE_KEY: ${{ secrets.DASHBOARD_COOKIE_KEY }}
      GATEWAY_VPC_IP: ${{ secrets.GATEWAY_VPC_IP }}
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      APPLICATION_PRIVATE_KEY: ${{ secrets.APPLICATION_PRIVATE_KEY }}

  deploy-broker:
    needs: detect-changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.detect-changes.outputs.broker == 'true'
    uses: ./.github/workflows/deploy-broker.yaml
    with:
      broker_aud: ${{ vars.BROKER_AUD }}
    secrets:
      BROKER_SSH_KEY: ${{ secrets.BROKER_SSH_KEY }}
      BROKER_HOST: ${{ secrets.BROKER_HOST }}
      CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}
