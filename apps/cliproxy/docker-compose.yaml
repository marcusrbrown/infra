services:
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v6.9.38@sha256:5d71649bd5ba69e35bc069e878326e686bdd67ce0d57c693796dfa6bf9b8094e
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8317/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
