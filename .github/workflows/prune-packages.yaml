name: Prune Untagged Packages

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually delete untagged versions (default is dry-run)
        required: false
        type: boolean
        default: false

concurrency:
  group: prune-packages
  cancel-in-progress: false

jobs:
  # The dry-run only lists versions, so it gets read access; only an explicit apply gets write.
  preview:
    if: ${{ !inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: List untagged GHCR versions (dry-run)
        working-directory: packages/cli
        run: bun run scripts/prune-untagged-packages.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  apply:
    if: ${{ inputs.apply }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Delete untagged GHCR versions
        working-directory: packages/cli
        run: bun run scripts/prune-untagged-packages.ts --apply
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
