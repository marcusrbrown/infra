# Trace collection stack: collector -> Langfuse (whole traces) and Tempo (keep-listed attributes only).
#
# Derived from the Langfuse compose file at v4.83.0 (docker.langfuse.com). Changes from upstream:
#   - every image is pinned by tag and digest
#   - no AI gateway service
#   - nothing is published except Caddy (80, 443) and, on 127.0.0.1 only, Langfuse web and Grafana
#   - Prometheus and Grafana-managed alert rules added: failures reach a Discord webhook as fixed text and numbers
#   - a Topics embedder (Text Embeddings Inference, CPU) on the backend network only: Langfuse Topics needs an embedding
#     connection and the proxy has none. It is optional: no trace passes through it and nothing waits for it
#   - agent read access: a reader gate (token check, per-consumer limits, path and header allowlists, Viewer credentials
#     added at the gate) and a Grafana MCP server behind it. Caddy proxies two routes to the gate; neither service publishes
#     a port, nothing depends on either, and a failure of either never touches ingest
#   - two networks (see below), healthchecks, a log size limit and `restart: unless-stopped` everywhere
#   - telemetry and outbound update checks are off wherever a setting exists
#   - secrets are interpolated from the host `.env` or read from files, never written here
#
# Networks:
#   edge     Caddy, the collector, Langfuse web, Tempo, Prometheus, the health reporter, the reader gate. The
#            internet-facing, custom-built collector can reach nothing else (Prometheus answers read-only queries and
#            has no management endpoint on; the gate answers 401 without a reader token, and its health port carries no secrets).
#   backend  Grafana, ClickHouse, PostgreSQL, Redis, MinIO, Langfuse web and worker, the Topics embedder, Tempo,
#            Prometheus, the health reporter. The reporter bridges both: it reads the collector and Tempo on edge, and
#            ClickHouse, MinIO, the Langfuse worker and Grafana on backend. Prometheus bridges both: it scrapes
#            the collector, Tempo and the reporter on edge, and Grafana queries it on backend. The reader gate bridges
#            both: Caddy and Langfuse web on edge, the Grafana MCP server on backend (which is backend only, like Grafana).
#
# No ClickHouse memory limit, on purpose: capping it near 7 GB lost spans after the sender got 200.
#
# Config files are bind-mounted from ./config. Deploy recreates a service after it uploads one, so a
# single-file mount never serves a stale inode. Secret and token directories are mounted as
# directories, so an atomic replace is seen at once.
name: traces

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

x-langfuse-env:
  &langfuse-env # The UI is reached through an SSH tunnel, so its URL is loopback. Keep the tunnel's local port at 3000.
  NEXTAUTH_URL: http://localhost:3000
  # Both services listen on the address in HOSTNAME, which Docker sets to the container's own name. Without
  # this they refuse loopback, and the healthchecks and the deploy's in-container probe both use loopback.
  HOSTNAME: 0.0.0.0
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?}@postgres:5432/postgres
  SALT: ${SALT:?}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?}
  TELEMETRY_ENABLED: 'false'
  # One password user created by the bootstrap variables on the web service; nobody can sign up.
  AUTH_DISABLE_SIGNUP: 'true'
  # No AI gateway and no in-app agent: this instance only stores traces.
  LANGFUSE_AI_GATEWAY_DEPLOYED: 'false'
  LANGFUSE_IN_APP_AGENT_ENABLED: 'false'
  # API keys carry a role. "Application" is the narrowest role that can ingest.
  API_AUTH_MIGRATION: enforce
  API_KEY_PROJECT_ROLES_ENABLE: 'true'
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
  CLICKHOUSE_CLUSTER_ENABLED: 'false'
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_AUTH: ${REDIS_AUTH:?}
  # Topics: LLM connections (summary, embedding, naming) may reach these two hosts and no other. Langfuse blocks private
  # addresses by default; a listed host skips that check, which is how the Docker service name `embedder` is allowed.
  # `cliproxy.fro.bot` is the operator's proxy for the summary and naming models. Web checks a connection when it is
  # saved, the worker when it calls. No private-address exemption is set.
  LANGFUSE_LLM_CONNECTION_ALLOWED_HOSTS: embedder,cliproxy.fro.bot

x-langfuse-depends-on: &langfuse-depends-on
  postgres:
    condition: service_healthy
  minio:
    condition: service_healthy
  redis:
    condition: service_healthy
  clickhouse:
    condition: service_healthy

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    restart: unless-stopped
    # The only service published on all interfaces.
    ports:
      - '80:80'
      - '443:443'
    environment:
      TRACES_DOMAIN: ${TRACES_DOMAIN:?}
      # off (no ingest route), held (every ingest path answers 503) or open. Unset means off. The value
      # selects config/ingest/<state>.caddy; any other value stops Caddy from starting.
      TRACES_INGEST_STATE: ${TRACES_INGEST_STATE:-off}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./config/ingest:/etc/caddy/ingest:ro
    networks: [edge]
    depends_on:
      collector:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:2019/config/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging

  # The image is built in CI and handed to deploy by digest, as name:tag@sha256:<digest>. It is a
  # distroless image with no shell, so it has no compose healthcheck: the health_check extension
  # (:13133) is read by the health reporter instead.
  collector:
    image: ${TRACES_COLLECTOR_IMAGE:?}
    restart: unless-stopped
    command: [--config=/etc/otelcol/config.yaml]
    volumes:
      - ./config/otelcol.yaml:/etc/otelcol/config.yaml:ro
      # One directory per sender group, one token file inside it. Deploy creates the directories and
      # never writes a token.
      - ./tokens:/etc/otelcol/tokens:ro
      # The Langfuse key pair as a ready-made Basic credential, read at start.
      - ./secrets/collector:/etc/otelcol/secrets:ro
      - collector_queue:/var/lib/otelcol
    networks: [edge]
    # No depends_on: the collector must be able to start while a backend is down and queue until it returns.
    logging: *logging

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.88.0@sha256:272161cfd9e46934c693fbcd9ef160b1b7499a38bc4f836fac78cfa77eb46ccc
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - 127.0.0.1:3000:3000
    environment:
      <<: *langfuse-env
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?}
      NEXT_PUBLIC_SIGN_UP_DISABLED: 'true'
      # Media uploads are not used; this is upstream's browser-facing default.
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9090
      # The MCP endpoint refuses any Host header outside this list (and its own base URL's host). The reader gate sends this
      # exact host and port; no wildcard, and no other client reaches the route.
      LANGFUSE_MCP_ALLOWED_HOSTS: langfuse-web:3000
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      # Bootstrap values. Deploy sets them for the first start and removes them afterwards.
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:-}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:-}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:-}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:-}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:-}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:-}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:-}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:-}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:-}
    networks: [edge, backend]
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:3000/api/public/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    logging: *logging

  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.88.0@sha256:952869378c3fbb322be31d3aeec85034125ff02e3ab26fbb30b3c38d4b25a944
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    environment:
      <<: *langfuse-env
      # Events dispatch (on by default) stores each routed trace's whole transcript under the event-upload prefix for
      # Topics. The cleaner deletes those objects after three days; the 30-day rule on `events/` is the backstop.
      LANGFUSE_EVENTS_DISPATCH_TRANSCRIPT_CLEANER_ENABLED: 'true'
      # Each Topics job makes one summary call (the proxy) and one embedding call (the embedder). The default is 20 jobs
      # at once; four keeps a backfill from flooding the proxy or starving the CPU the stores share.
      LANGFUSE_TOPICS_TRACE_QUEUE_PROCESSING_CONCURRENCY: '4'
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:3030/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  clickhouse:
    image: clickhouse/clickhouse-server:26.3.73.9@sha256:8af86c531947da69d304b0e372313538401e20d384578404986e4ff993f7e671
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      # Password of the read-only user the health reporter reads the trace tables with (see the mount below).
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD:?}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      # System log TTLs. No memory settings in here, by design. One file, not the config.d directory: the
      # image keeps its own file there that makes the server listen beyond localhost, and a directory
      # mount hides it (the healthcheck still passes, and every other container is refused).
      - ./config/clickhouse/system-log-ttl.xml:/etc/clickhouse-server/config.d/system-log-ttl.xml:ro
      # The read-only reporter user. One file, not the users.d directory: the image's entrypoint writes
      # its own user file into that directory at start.
      - ./config/clickhouse-users/traces-reader.xml:/etc/clickhouse-server/users.d/traces-reader.xml:ro
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'wget --no-verbose --tries=1 --spider http://127.0.0.1:8123/ping || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *logging

  minio:
    # Chainguard publishes only the `latest` tag of this image without a subscription; the digest is
    # the real pin.
    image: cgr.dev/chainguard/minio:latest@sha256:9f0aab4471ebb181be3cfabea21b719303ec583cd9abdb7779f9e53032b844f7
    restart: unless-stopped
    entrypoint: sh
    # Create the 'langfuse' bucket before starting the service. The console is not served.
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?}
    volumes:
      - minio_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    logging: *logging

  redis:
    image: redis:7@sha256:6b645a37f49b0546582468706b32e71a8b7fbb5ba4583d0f9e27a8004716b738
    restart: unless-stopped
    # The password reaches redis-server through the environment, not through the compose file.
    command: [sh, -c, 'exec redis-server --requirepass "$$REDIS_AUTH" --maxmemory-policy noeviction']
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?}
      REDISCLI_AUTH: ${REDIS_AUTH:?}
    volumes:
      - redis_data:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 10s
      retries: 10
    logging: *logging

  postgres:
    # Held at this major. A major upgrade needs a dump and restore, not an image bump.
    image: postgres:17@sha256:97fb53376be3e4fb1a8a61421daa69dcc3bf2fa39bda3259f5245f9a455af1a9
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *logging

  # Distroless image with no shell, so no compose healthcheck: the health reporter reads /ready.
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    restart: unless-stopped
    command: [-config.file=/etc/tempo/tempo.yaml]
    volumes:
      - ./config/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [edge, backend]
    logging: *logging

  # Scrapes the collector, Tempo, the health reporter and itself, and keeps 15 days of samples (2 GB at most). It
  # evaluates no rules: Grafana queries it and owns the alert rules, which post to a Discord webhook. No Alertmanager,
  # no lifecycle endpoint, no admin API, no remote-write receiver. The image runs as `nobody`; `PROMETHEUS_USER_ID` in
  # src/host.ts is that one id, and deploy gives the data volume to it (a test pins both).
  prometheus:
    image: prom/prometheus:v3.13.5@sha256:aafa9d694e6a883c02db516d9f6e5b84e14195f49a2a6456a4cca815edda72b9
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [edge, backend]
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:9090/-/ready || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  grafana:
    image: grafana/grafana:13.3.2@sha256:81556409ba48b2b922e0adb69a2511337d8ba7578f11962eefa6149a2d815101
    restart: unless-stopped
    # The image's own user is 472 with group 0. Deploy makes `secrets/grafana` `root:472`, mode 0750, so a process
    # whose group is 0 cannot enter it: Grafana would log "Permission denied" for both secret files and start on its
    # defaults (admin password `admin`). Group 472 is what lets it read them. `GRAFANA_USER_ID` in src/host.ts is
    # this one id; a test pins it, and the deploy's `grafana-signin` check proves the password file is in use.
    user: '472:472'
    ports:
      - 127.0.0.1:3001:3000
    environment:
      # Reached through the SSH tunnel at http://localhost:3001. Keep the tunnel's local port at 3001.
      GF_SERVER_ROOT_URL: http://localhost:3001/
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana/admin-password
      GF_SECURITY_SECRET_KEY__FILE: /run/secrets/grafana/secret-key
      # No anonymous access, no sign-up, no sharing of any kind.
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_USERS_ALLOW_ORG_CREATE: 'false'
      GF_PUBLIC_DASHBOARDS_ENABLED: 'false'
      GF_SNAPSHOTS_ENABLED: 'false'
      GF_SNAPSHOTS_EXTERNAL_ENABLED: 'false'
      GF_METRICS_ENABLED: 'false'
      # No outbound calls: analytics, update checks, Gravatar, the news feed, the plugin pre-installer.
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: 'false'
      GF_ANALYTICS_FEEDBACK_LINKS_ENABLED: 'false'
      GF_SECURITY_DISABLE_GRAVATAR: 'true'
      GF_NEWS_NEWS_FEED_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_DISABLED: 'true'
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: 'false'
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: 'false'
      GF_CLOUD_MIGRATION_ENABLED: 'false'
      # The one outbound call Grafana makes: the alert rules post to this Discord webhook (the contact point reads it
      # as $TRACES_DISCORD_WEBHOOK_URL). Required, so a stack without a place to send alerts does not start.
      TRACES_DISCORD_WEBHOOK_URL: ${TRACES_DISCORD_WEBHOOK_URL:?}
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - ./secrets/grafana:/run/secrets/grafana:ro
      - grafana_data:/var/lib/grafana
    networks: [backend]
    depends_on:
      - tempo
    healthcheck:
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging: *logging

  # OpenAI-compatible `POST /v1/embeddings` for Langfuse Topics, from a small model on this host. Langfuse reaches it as
  # http://embedder:8080/v1 (the host is on the LLM allow-list above); nothing else does. Optional, like Grafana and
  # Prometheus: no trace passes through it, nothing depends on it, and deploy pulls and starts it after the route is set.
  # The model is pinned by revision (a commit, never a branch). With no copy in the volume the first start reads
  # BAAI/bge-small-en-v1.5 (133 MB) from huggingface.co at that revision, once. Later starts read the volume and come up
  # with no network at all (tested), but each start still asks huggingface.co for two optional weight files this model
  # does not have, and TEI tolerates the refusal; no setting turns that off. No token and no tracing endpoint is set,
  # and the router has no usage reporting. `EMBEDDER_USER_ID` in
  # src/host.ts is `nobody`, and deploy gives the volume to it (a test pins both). Output is 384 dimensions.
  embedder:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    restart: unless-stopped
    user: '65534:65534'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    cpus: 2
    command:
      - --model-id=BAAI/bge-small-en-v1.5
      - --revision=5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - --port=8080
      # Langfuse's OpenAI-compatible adapter sends up to 2048 inputs per request; the router's default is 32.
      - --max-client-batch-size=2048
    environment:
      RAYON_NUM_THREADS: '2'
    tmpfs:
      - /tmp
    volumes:
      - embedder_models:/data
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:8080/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      # The first start downloads the model before it answers.
      start_period: 300s
    logging: *logging

  # Reads every dependency and runs a canary through the collector's private receiver; Caddy proxies only
  # /healthz to it. A small Bun script from a pinned image, with its source mounted read-only: no build step,
  # no dependencies, no Docker socket, no published port, no root. It starts without waiting for the stack, so a
  # stack that is down is reported instead of leaving the reporter unstarted.
  health-reporter:
    image: oven/bun:1.4.5-alpine@sha256:da816670775f4c2b4e990b6b1847cf5540dcdc721a42033dd331ce7a88ba6a3b
    restart: unless-stopped
    # Tempo's own user (`TEMPO_USER_ID` in src/host.ts). Tempo creates its data directories with mode 0700, so no
    # other user can list `blocks`, and the Tempo age check would stay unknown and keep ingest closed. A test pins
    # this value to that constant.
    user: '10001:10001'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: [bun, run, --no-install, /app/health-report.ts]
    environment:
      # Nothing to write to: the runtime's transpiler cache is off and /tmp is a tmpfs.
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
    tmpfs:
      - /tmp
    volumes:
      # The reporter's source, uploaded by deploy as one directory.
      - ./health-reporter:/app:ro
      # Two password files, owned by the reporter's user (Tempo's) and mode 0400: clickhouse-password (the
      # read-only `traces_reader` user) and minio-password (the object store's root user, to list batch ages).
      - ./secrets/reporter:/run/secrets/reporter:ro
      # Tempo's blocks, for the age of its oldest data. Read-only; readable only because the reporter runs as Tempo's user.
      - tempo_data:/var/tempo:ro
      # Two files and a directory that only say how full each disk is: the volume (through its sentinel file,
      # which also proves it is the right volume) and the root filesystem.
      - /mnt/traces/.traces-volume:/host/volume-sentinel:ro
      - /srv:/host/root:ro
    networks: [edge, backend]
    # No depends_on: it must start when a service is down and say so.
    healthcheck:
      # The loopback listener answers while the process is up, whatever the verdict says.
      test: [CMD-SHELL, 'wget -q --spider http://127.0.0.1:8081/live || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  # Agent read access, part one. The gate authenticates reader tokens, limits each consumer, forwards only allowlisted
  # paths and headers, and adds the Viewer credentials it reads from files. Caddy proxies /agent/langfuse/* and
  # /agent/grafana/* to it on 8090, outside the ingest-state files, so reads stay up while ingest is held or off. Port
  # 8091 serves /healthz (upstream reachability, no secrets) to the network and to the health reporter. The same Bun
  # image as the reporter, source mounted read-only, no build step and no dependencies. It runs as its own user
  # (`READER_GATE_USER_ID` in src/host.ts; deploy owns the two mounted directories `root:10003`), apart from Tempo's, so it
  # cannot read what the reporter reads. It mounts `readers/` and never `tokens/`; the collector mounts the reverse. Like
  # the monitoring services, no trace passes through it, nothing depends on it, and deploy starts it after the route is set.
  reader-gate:
    image: oven/bun:1.4.5-alpine@sha256:da816670775f4c2b4e990b6b1847cf5540dcdc721a42033dd331ce7a88ba6a3b
    restart: unless-stopped
    user: '10003:10003'
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    command: [bun, run, --no-install, /app/main.ts]
    environment:
      BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'
      READER_TOKEN_FILE: /run/readers/token
      LANGFUSE_BASIC_FILE: /run/secrets/reader-gate/langfuse-basic
      GRAFANA_MCP_CALLER_FILE: /run/secrets/mcp-caller/token
      LANGFUSE_UPSTREAM: http://langfuse-web:3000
      GRAFANA_MCP_UPSTREAM: http://grafana-mcp:8000
    tmpfs:
      - /tmp
    volumes:
      - ./reader-gate:/app:ro
      # The reader token file, as a directory so an atomic replace is seen. Read about once a second.
      - ./readers:/run/readers:ro
      # The Langfuse Viewer key pair as one `<public>:<secret>` line. Placeholder until the operator installs a key.
      - ./secrets/reader-gate:/run/secrets/reader-gate:ro
      # The Grafana MCP caller token, sent on the Grafana route only. Deploy generates it once.
      - ./secrets/mcp-caller:/run/secrets/mcp-caller:ro
    networks: [edge, backend]
    # No depends_on: a down upstream is an answer (502), not a reason to stay down.
    healthcheck:
      # Any response proves the listeners are up. An unreachable upstream shows in the body, not in the container state.
      test: [CMD, bun, -e, "await fetch('http://127.0.0.1:8091/healthz', {signal: AbortSignal.timeout(3000)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *logging

  # Agent read access, part two: a Grafana MCP server that queries Tempo and Prometheus through Grafana with a Viewer
  # service-account token it reads from a file (re-read on every request). Backend network only; the gate is the one way
  # in. Read tools only: write tools are off, only four tool categories are on, the per-request Grafana address and
  # credential overrides stay off, and usage reporting is off (it would otherwise reach the vendor). The Host header the
  # gate sends carries the port and the match is exact, so `--allowed-hosts` names it with the port. The image is Debian
  # slim with no curl or wget, so it has no healthcheck: the gate's /healthz reports whether it answers (that endpoint
  # stays open; the MCP endpoint does not). Its user is `mcp-grafana`, uid 1000 and primary group 999; naming 1000:1000
  # makes the group match the secret directory's (`GRAFANA_MCP_USER_ID` in src/host.ts, pinned by a test).
  #
  # Caller token: MCP calls without `--server-auth-header` are refused, so only the gate can call it. The server takes the
  # token from argv or `MCP_GRAFANA_SERVER_TOKEN` only (no file variant in v2.4.0), so the entrypoint reads the file into
  # the server's environment and execs it. It accepts only what the gate accepts (`CALLER_TOKEN_ALPHABET` and
  # `CALLER_TOKEN_LENGTH` in reader-gate/constants.ts, at most one trailing newline), so a bad file stops the container with a
  # fixed message and no token text, and never starts open or on a token the gate would refuse to send. It joins the gate's
  # group to read that one file.
  grafana-mcp:
    image: grafana/mcp-grafana:2.4.0@sha256:63d4501d3166c2b9242d8a2b5b7df8892c59c6c477be3a2a61bcf8a252671f31
    restart: unless-stopped
    user: '1000:1000'
    group_add: ['10003']
    read_only: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    entrypoint:
      - /bin/sh
      - -c
      - >-
        f=/run/secrets/mcp-caller/token;
        bad() { echo 'grafana-mcp: the caller token file is missing or is not exactly one valid token' >&2; exit 1; };
        [ -r "$$f" ] || bad;
        { IFS= read -r token; IFS= read -r extra && extra=more; } < "$$f";
        [ -z "$$extra" ] || bad;
        case "$$token" in *[!A-Za-z0-9_-]*) bad;; esac;
        [ "$${#token}" -eq 43 ] || bad;
        export MCP_GRAFANA_SERVER_TOKEN="$$token"; exec /app/mcp-grafana "$$@"
      - mcp-grafana
    command:
      - -t
      - streamable-http
      - --address
      - ':8000'
      - --allowed-hosts
      - grafana-mcp:8000
      - --enabled-tools
      - tempo,prometheus,datasource,search
      - --disable-write
      - --usage-stats=disabled
      - --server-auth-header
      - x-reader-gate-token
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: /run/secrets/grafana-mcp/token
    tmpfs:
      - /tmp
    volumes:
      # The service-account token as one file. Placeholder until the operator runs `traces reader backend grafana`.
      - ./secrets/grafana-mcp:/run/secrets/grafana-mcp:ro
      # The caller token, shared with the gate. Read once, at start.
      - ./secrets/mcp-caller:/run/secrets/mcp-caller:ro
    networks: [backend]
    logging: *logging

networks:
  edge: {}
  backend: {}

volumes:
  caddy_data: {}
  caddy_config: {}
  collector_queue: {}
  clickhouse_data: {}
  clickhouse_logs: {}
  minio_data: {}
  redis_data: {}
  postgres_data: {}
  tempo_data: {}
  prometheus_data: {}
  grafana_data: {}
  embedder_models: {}
