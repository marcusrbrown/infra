services:
  caddy:
    image: caddy:2.11.3-alpine@sha256:bb56e6200ec26a67f04be90255993dc390c9815967f67f24b4ca6466e88de64b
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v6.10.9@sha256:e36bfc054e1cf2aea69a09ee03d62f0c3d69aac290e88ceee8d003707d8560eb
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8317/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
