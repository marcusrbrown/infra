name: Deploy KeeWeb

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      deploy_nginx:
        description: Deploy nginx config in addition to content
        required: false
        type: boolean
        default: true
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      DROPBOX_APP_SECRET:
        required: true

concurrency:
  group: deploy-keeweb-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy-keeweb:
    runs-on: ubuntu-latest
    environment: keeweb
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate required secrets
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
        run: |
          missing=()
          [[ -n "${DEPLOY_SSH_KEY}" ]] || missing+=("DEPLOY_SSH_KEY")
          [[ -n "${DROPBOX_APP_SECRET}" ]] || missing+=("DROPBOX_APP_SECRET")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Build KeeWeb dist
        run: bun run --cwd apps/keeweb build
        env:
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy content
        run: bash apps/keeweb/deploy.sh

      - name: Deploy nginx config
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'workflow_call' && inputs.deploy_nginx)
        run: bash apps/keeweb/deploy.sh --nginx

      - name: Post-deploy health check
        run: curl -sf -o /dev/null -w "%{http_code}" https://kw.igg.ms/ | grep -q "^200"
