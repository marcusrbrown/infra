services:
  caddy:
    image: caddy:2.11.2-alpine@sha256:834468128c7696cec0ceea6172f7d692daf645ae51983ca76e39da54a97c570d
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile

  cli-proxy-api:
    image: eceasy/cli-proxy-api:v6.9.41@sha256:27a8090de418fd5ef96fae91ba6ba8579874806d573c5de3f8d13a1a4fe5ee91
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MANAGEMENT_PASSWORD: ${MANAGEMENT_PASSWORD:-}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8317/healthz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - cliproxy_auth:/root/.cli-proxy-api
      - ./config/config.yaml:/CLIProxyAPI/config.yaml
      # - cliproxy_logs:/var/log/cliproxy

volumes:
  caddy_data:
  caddy_config:
  cliproxy_auth:
  # Uncomment to persist logs when logging-to-file is enabled:
  # cliproxy_logs:
