name: Prune Untagged Packages

permissions:
  contents: read
  packages: write

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Actually delete untagged versions (default is dry-run)
        required: false
        type: boolean
        default: false

concurrency:
  group: prune-packages
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Prune untagged GHCR versions
        working-directory: packages/cli
        run: |
          if [[ "${APPLY}" == "true" ]]; then
            bun run scripts/prune-untagged-packages.ts --apply
          else
            bun run scripts/prune-untagged-packages.ts
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLY: ${{ inputs.apply }}
