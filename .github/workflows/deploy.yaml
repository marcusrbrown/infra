name: Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      keeweb: ${{ steps.filter.outputs.keeweb }}
      nginx: ${{ steps.filter.outputs.nginx }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            keeweb:
              - 'apps/keeweb/**'
            nginx:
              - 'apps/keeweb/config/kw.igg.ms.conf'

  deploy-keeweb:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.keeweb == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build KeeWeb dist
        run: bun run build
        working-directory: apps/keeweb
        env:
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd # v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy content
        run: bash apps/keeweb/deploy.sh

      - name: Deploy nginx config
        if: needs.detect-changes.outputs.nginx == 'true' || github.event_name == 'workflow_dispatch'
        run: bash apps/keeweb/deploy.sh --nginx

      - name: Post-deploy health check
        run: curl -sf -o /dev/null -w "%{http_code}" https://kw.igg.ms/ | grep -q "^200"
