name: Deploy VPN

permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      VPN_SSH_KEY:
        required: true
      VPN_HOST:
        required: true
      VPN_PEERS:
        required: false

concurrency:
  group: deploy-vpn-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    environment: deploy-notify
    permissions:
      contents: read
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Post deploy gate notification
        env:
          DEPLOY_GATE_DISCORD_WEBHOOK: ${{ secrets.DEPLOY_GATE_DISCORD_WEBHOOK }}
          DEPLOY_GATE_APP: vpn
          DEPLOY_GATE_COMMIT_SUBJECT: ${{ github.event.head_commit.message }}
        run: bun run packages/cli/scripts/deploy-gate-notify.ts

  deploy-vpn:
    needs: notify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment: vpn
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Validate required secrets
        env:
          VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
          VPN_HOST: ${{ secrets.VPN_HOST }}
        run: |
          missing=()
          [[ -n "${VPN_SSH_KEY}" ]] || missing+=("VPN_SSH_KEY")
          [[ -n "${VPN_HOST}" ]] || missing+=("VPN_HOST")
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secret(s): ${missing[*]}"
            exit 1
          fi

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Deploy vpn
        run: bun run --cwd apps/vpn deploy
        env:
          VPN_SSH_KEY: ${{ secrets.VPN_SSH_KEY }}
          VPN_HOST: ${{ secrets.VPN_HOST }}
          VPN_PEERS: ${{ secrets.VPN_PEERS }}
