services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    env_file:
      - path: .env
        required: false
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./config/Caddyfile:/etc/caddy/Caddyfile
    depends_on:
      - umami

  umami:
    image: umamisoftware/umami:3.4.1@sha256:b06a858671ba2dd35acac8852b7a8dfc8da14e646fd18a4f9fdc3cbd13f2c562
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_TYPE: postgresql
      APP_SECRET: ${APP_SECRET:-}
      # Privacy posture: disable Umami's anonymous telemetry phone-home and
      # block outbound external calls (favicon/location lookups). Both are the
      # reason this deployment exists — do not remove.
      DISABLE_TELEMETRY: '1'
      PRIVATE_MODE: '1'
    depends_on:
      db:
        condition: service_healthy
    init: true
    healthcheck:
      test: [CMD-SHELL, 'curl -f http://localhost:3000/api/heartbeat || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  db:
    image: postgres:15-alpine@sha256:a8e042598834300dfaa17a54f695b87b7f25d3490433bbbe2ef3bffbb9747f24
    restart: unless-stopped
    # Postgres is reachable only on the internal compose network — port 5432 is
    # intentionally NOT published to the host. Caddy terminates TLS and proxies
    # to umami:3000; the database has no external surface.
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  caddy_data:
  caddy_config:
  umami-db-data:
