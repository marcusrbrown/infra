name: Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      keeweb: ${{ steps.filter.outputs.keeweb }}
      nginx: ${{ steps.filter.outputs.nginx }}
      cliproxy: ${{ steps.filter.outputs.cliproxy }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            keeweb:
              - 'apps/keeweb/**'
            nginx:
              - 'apps/keeweb/config/kw.igg.ms.conf'
            cliproxy:
              - 'apps/cliproxy/**'

  deploy-keeweb:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.keeweb == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build KeeWeb dist
        run: bun run build
        working-directory: apps/keeweb
        env:
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy content
        run: bash apps/keeweb/deploy.sh

      - name: Deploy nginx config
        if: needs.detect-changes.outputs.nginx == 'true' || github.event_name == 'workflow_dispatch'
        run: bash apps/keeweb/deploy.sh --nginx

      - name: Post-deploy health check
        run: curl -sf -o /dev/null -w "%{http_code}" https://kw.igg.ms/ | grep -q "^200"

  deploy-cliproxy:
    needs: detect-changes
    if: github.event_name == 'workflow_dispatch' || needs.detect-changes.outputs.cliproxy == 'true'
    runs-on: ubuntu-latest
    environment: cliproxy
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Configure SSH known_hosts
        run: mkdir -p ~/.ssh && cp .github/known_hosts ~/.ssh/known_hosts

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.CLIPROXY_SSH_KEY }}

      - name: Deploy cliproxy
        run: bun run --cwd apps/cliproxy deploy
        env:
          CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}
          CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}

      - name: Post-deploy health check
        run: >-
          curl -sf -o /dev/null -w "%{http_code}" "https://${CLIPROXY_DOMAIN}/v0/management/latest-version"
          -H "Authorization: Bearer ${CLIPROXY_MANAGEMENT_KEY}" | grep -q "^200"
        env:
          CLIPROXY_DOMAIN: ${{ secrets.CLIPROXY_DOMAIN }}
          CLIPROXY_MANAGEMENT_KEY: ${{ secrets.CLIPROXY_MANAGEMENT_KEY }}
